name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Compile, lint, and test
        run: npm run check

      - name: Build VSIX
        run: npm run package:vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: markdown-mode-memory-vsix
          path: markdown-mode-memory.vsix
          if-no-files-found: error
          retention-days: 14
