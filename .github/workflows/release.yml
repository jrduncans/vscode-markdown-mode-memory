name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package extension
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node --print \"require('./package.json').version\")"
          release_version="${RELEASE_TAG#v}"
          test "$release_version" = "$package_version"

      - name: Compile, lint, and test
        run: npm run check

      - name: Build VSIX
        env:
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
            npm run package:vsix -- --pre-release
          else
            npm run package:vsix
          fi

      - name: Attach VSIX to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" markdown-mode-memory.vsix --clobber
