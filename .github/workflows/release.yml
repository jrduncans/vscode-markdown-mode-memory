name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to package
        required: true
        type: string
      prerelease:
        description: Package the VSIX for the Marketplace prerelease channel
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package extension
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          package_version=$(node --print "require('./package.json').version")
          release_version="${RELEASE_TAG#v}"
          if [ "$release_version" != "$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi

      - name: Compile, lint, and test
        run: npm run check

      - name: Build VSIX
        env:
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease || inputs.prerelease || false }}
        run: |
          if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
            npm run package:vsix -- --pre-release
          else
            npm run package:vsix
          fi

      - name: Attach VSIX to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" markdown-mode-memory.vsix --clobber
